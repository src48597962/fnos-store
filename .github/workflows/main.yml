name: Build and Release fpk

on:
  # 允许你在 Actions 页面手动点击运行
  workflow_dispatch:
  # 当你打 v* 标签时自动运行
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmmirror.com'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      # ✅ 新增：自动下载 fnpack 打包工具
      - name: Download fnpack
        run: |
          mkdir -p build
          curl -L -o build/fnpack "https://static2.fnnas.com/fnpack/fnpack"
          chmod +x build/fnpack
          # 验证是否下载成功
          ./build/fnpack --version || echo "fnpack 下载完成"

      # ✅ 运行 build.sh 生成 .fpk 包
      - name: Run build.sh to create fpk
        run: |
          sed -i 's/\r$//' ./build.sh
          chmod +x ./build.sh
          ./build.sh

      # ✅ 上传构建产物到 Actions 页面
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnos-store-build-output
          path: |
            *.fpk
            store-server-*
            build/
            dist/
            release/

      # ✅ 如果打了 tag，就自动创建 Release 并上传产物
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          # 收集所有 .fpk 和 store-server-* 文件
          FILES=$(ls *.fpk store-server-* 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "⚠️ 没有找到可发布的文件，跳过 Release"
            exit 0
          fi
          gh release create "$TAG" \
            --title "fnos-store $TAG" \
            --generate-notes \
            $FILES \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
