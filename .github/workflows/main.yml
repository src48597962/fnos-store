name: Build fnos-store

on:
  # 允许你在 Actions 页面手动点击运行
  workflow_dispatch:
  # 当你 push 代码到 main 分支时自动运行
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 配置 Go 环境 (改成 stable，避免版本不匹配报错)
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        # 关闭自动缓存，避免因为缺少 go.sum 报错
        cache: false

    # 2. 配置 Node.js 环境
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. 赋予脚本执行权限
    - name: Make build script executable
      run: chmod +x ./build.sh

    # 4. 执行构建
    - name: Run build script
      run: ./build.sh

    # 5. 上传构建产物
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fnos-store-build-output
        path: |
          *.fpk
          store-server-*
          dist/
